name: Сборка APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # чтобы публиковать APK в Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Права на gradlew (после коммита с Windows)
        run: chmod +x gradlew

      - name: Тесты логики расписания
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Сборка APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Переименовать APK
        run: cp app/build/outputs/apk/debug/app-debug.apk peremena.apk

      - uses: actions/upload-artifact@v4
        with:
          name: peremena-apk
          path: peremena.apk

      # Каждая сборка с ветки main — отдельный релиз. Постоянная ссылка на свежий APK:
      # https://github.com/<владелец>/<репозиторий>/releases/latest/download/peremena.apk
      - name: Опубликовать в Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          body: Автосборка из коммита ${{ github.sha }}
          files: peremena.apk
          make_latest: true
